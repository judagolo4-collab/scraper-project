# Configuración para Colombia - Cámara de Representantes

pais: "Colombia"
institucion: "Camara"
url: "https://www.camara.gov.co/secretaria/proyectos-de-ley#menu"

# Configuración de Selenium
selenium:
  wait_time: 10
  driver_path: "/opt/homebrew/bin/chromedriver"  # Ruta en macOS con Homebrew
  chromium_path: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
  
# Selectores CSS para elementos de la página
selectors:
  # Tabla principal de proyectos
  tabla_proyectos: "table tbody tr"
  
  # Paginación
  paginacion_siguiente: "button.pagina-btn[data-pagina='next']"
  paginacion_numeros: "button.pagina-num"
  
  # Página de detalle
  fecha_radicacion_xpath: "//strong[contains(text(), 'Fecha de Radicación')]"
  objeto_proyecto_xpath: "//strong[contains(text(), 'Objeto del proyecto')]/following-sibling::p[1]"
  pdf_documento: "div.pl-pub-item a[href*='.pdf']"
  pdf_documento_alt: "//a[contains(text(), 'Ver Documento')]"
  gaceta_link: "//a[contains(text(), 'Gaceta')]"

# Configuración de paginación
pagination:
  next_button: "button.pagina-btn[data-pagina='next']"
  click_delay: 2  # Segundos de espera después de hacer click

# Configuración de logging
log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR

# Límites y timeouts
limits:
  max_pages: null  # null = sin límite, o número específico
  max_projects_per_page: 100
  request_delay: 1  # Segundos entre requests
  
# Campos a extraer
campos:
  basicos:
    - numero_camara
    - numero_senado
    - titulo
    - tipo
    - autores
    - estado
    - origen
    - comision
    - legislatura
  detalle:
    - fecha_radicacion
    - resumen
    - url_pdf
    - url_gaceta
